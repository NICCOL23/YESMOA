<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>YESMOA 샘플 영상</title>
<style>html,body{margin:0;width:100%;height:100%;background:#102f42;color:white;font:14px system-ui,sans-serif}#player{width:100%;height:100%;border:0}#error{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:16px;background:#102f42;gap:12px}#error[hidden]{display:none}p{margin:0;line-height:1.5}a{color:#abf1e2;text-decoration:none;border:1px solid #abf1e260;border-radius:12px;padding:10px 14px}small{color:#bad0da}</style></head><body>
<iframe id="player" title="YESMOA 남창 5일장 샘플 영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
<div id="error" hidden role="status"><p id="message">영상 연결을 확인해 주세요.</p><a href="https://www.youtube.com/watch?v=gB2YGQuKiGo" target="_blank" rel="noopener">유튜브에서 영상 보기 ↗</a><small id="code"></small></div>
<script>
'use strict';
if(location.protocol==='file:'){location.replace('https://niccol23.github.io/YESMOA/video-player.html?v=20261001-fix');}
else {
const query=new URLSearchParams({enablejsapi:'1',origin:location.origin,autoplay:'1',mute:'1',playsinline:'1',controls:'1',loop:'1',playlist:'gB2YGQuKiGo',rel:'0'});
document.getElementById('player').src='https://www.youtube.com/embed/gB2YGQuKiGo?'+query;
window.onYouTubeIframeAPIReady=function(){new YT.Player('player',{events:{onReady:function(event){event.target.mute();event.target.playVideo();},onError:function(event){document.getElementById('error').hidden=false;document.getElementById('message').textContent=event.data===153?'브라우저에서 영상 연결을 제한하고 있습니다.':(event.data===101||event.data===150?'이 영상은 웹사이트 재생이 제한되어 있습니다.':'영상을 재생하지 못했습니다.');document.getElementById('code').textContent='오류 '+event.data;}}});};
const api=document.createElement('script');api.src='https://www.youtube.com/iframe_api';document.head.appendChild(api);
}
</script></body></html>
